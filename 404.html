<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>The Shape of a Book · Codex Maledictus</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Text:ital,wght@0,400;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{min-height:100vh;min-height:100svh;color:#E4DDD0;font-family:'Crimson Text',Georgia,serif;display:flex;align-items:center;justify-content:center;padding:32px 22px 48px;overflow-x:hidden;
    background:radial-gradient(ellipse at 50% 30%,rgba(74,18,58,.5),transparent 58%),radial-gradient(ellipse at 18% 88%,rgba(12,70,72,.42),transparent 52%),radial-gradient(ellipse at 88% 76%,rgba(92,58,14,.34),transparent 50%),#040305;}
  #drift{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;}
  main{position:relative;max-width:560px;width:100%;text-align:center;}
  .mark{width:min(64vw,270px);height:auto;display:block;margin:0 auto 26px;overflow:visible;}
  .mark .r1{transform-origin:150px 150px;animation:turn 160s linear infinite;}
  .mark .r2{transform-origin:150px 150px;animation:turn 220s linear infinite reverse;}
  .mark .lid{transform-origin:150px 150px;animation:blink 9s ease-in-out infinite;}
  @keyframes turn{to{transform:rotate(360deg)}}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.06)}}
  h1{font:700 clamp(1.35rem,5.6vw,2rem)/1.35 'Cinzel Decorative',Georgia,serif;color:#E0C878;text-shadow:0 0 26px rgba(224,200,120,.35);}
  p{font-size:1.16rem;line-height:1.65;font-style:italic;margin:16px auto 0;max-width:26em;color:rgba(228,221,208,.86);}
  nav{display:grid;gap:12px;margin:34px auto 0;max-width:390px;}
  nav a{display:block;padding:16px 18px;min-height:52px;border:1px solid rgba(201,168,76,.42);color:#E4DDD0;text-decoration:none;font-size:1.08rem;background:rgba(8,5,10,.55);transition:border-color .4s,background .4s;}
  nav a:hover,nav a:focus-visible{border-color:#E0C878;background:rgba(224,200,120,.09);}
  .tag{font:400 .82rem/1.6 'Share Tech Mono',monospace;letter-spacing:.1em;color:rgba(143,240,229,.78);margin-top:34px;}
  @media (prefers-reduced-motion:reduce){.mark *{animation:none!important;}}
</style>
</head>
<body>
<canvas id="drift" aria-hidden="true"></canvas>
<main>
  <svg class="mark" viewBox="0 0 300 300" aria-hidden="true">
    <g fill="none" stroke="#C9A84C" stroke-width="1.2">
      <circle cx="150" cy="150" r="138" opacity=".55"/><circle cx="150" cy="150" r="112" opacity=".4"/>
      <g class="r1" opacity=".7"><path d="M150 12 231 248 18 108 282 108 69 248Z"/></g>
      <g class="lid"><path d="M78 150Q150 92 222 150Q150 208 78 150Z" stroke="#E0C878" stroke-width="1.8" fill="rgba(4,3,5,.85)"/><circle cx="150" cy="150" r="25" stroke="#8FF0E5"/><circle cx="150" cy="150" r="9" fill="#E0C878" stroke="none"/></g>
    </g>
    <g class="r2" id="seats" fill="#E0C878" font-size="15" text-anchor="middle"></g>
  </svg>
  <h1>The shelf is here. The page is not.</h1>
  <p>In the dust where it stood there is the clean shape of a book, and the shape is still warm.</p>
  <nav>
    <a href="/">Go back to the eye</a>
    <a href="/pale-archive.html">Ask the Pale Archive for another</a>
    <a href="/play/">A computer was left running. Sit down at it.</a>
  </nav>
  <div class="tag">Don't let it go unheard.</div>
</main>
<script>
(function(){
  var G=['ᚠ','ᚢ','ᚦ','ᚨ','ᚱ','ᚲ','ᚷ','ᚹ','ᚺ','ᚾ','ᛉ','ᛟ','△','▽'], NS='http://www.w3.org/2000/svg', s=document.getElementById('seats');
  for(var i=0;i<13;i++){var a=i/13*Math.PI*2-Math.PI/2,t=document.createElementNS(NS,'text');t.setAttribute('x',150+Math.cos(a)*125);t.setAttribute('y',155+Math.sin(a)*125);t.textContent=G[i];if(i%4)t.setAttribute('opacity','.5');s.appendChild(t);}
  var c=document.getElementById('drift'),x=c.getContext('2d'),W,H,P=[],still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,C=['201,168,76','143,240,229','170,40,60','150,110,220'];
  function size(){var d=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);}
  function make(y){return {x:Math.random()*W,y:y,s:9+Math.random()*16,v:.12+Math.random()*.34,o:.1+Math.random()*.3,g:G[Math.random()*G.length|0],c:C[Math.random()*C.length|0],w:Math.random()*6.28};}
  size();addEventListener('resize',size);for(var n=0;n<46;n++)P.push(make(Math.random()*H));
  function draw(){x.clearRect(0,0,W,H);P.forEach(function(p,i){p.y-=p.v;p.w+=.008;if(p.y<-30)P[i]=p=make(H+20);x.globalAlpha=p.o;x.fillStyle='rgb('+p.c+')';x.font=p.s+'px serif';x.fillText(p.g,p.x+Math.sin(p.w)*12,p.y);});if(!still)requestAnimationFrame(draw);}
  draw();
})();
</script>
